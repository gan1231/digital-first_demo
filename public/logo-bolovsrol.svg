<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Дорноговь аймгийн Боловсролын газрын лого">
  <defs>
    <path id="bg-top" d="M 28,100 A 72,72 0 0,1 172,100"/>
    <path id="bg-bottom" d="M 32,100 A 68,68 0 0,0 168,100"/>
    <g id="bg-petal">
      <path d="M 100,34 C 86,46 81,60 90,70 C 95,76 105,76 110,70 C 119,60 114,46 100,34 Z" fill="none" stroke="#1F6FD0" stroke-width="2"/>
      <path d="M 100,44 C 92,52 89,61 95,68" fill="none" stroke="#1F6FD0" stroke-width="1.6"/>
    </g>
    <g id="bg-trefoil" fill="#FFE800" stroke="#E30613" stroke-width="1.4">
      <circle cx="100" cy="36" r="3"/>
      <circle cx="96" cy="42" r="3"/>
      <circle cx="104" cy="42" r="3"/>
    </g>
    <path id="bg-ray" d="M 100,68 C 96,78 96,86 100,92 C 104,86 104,78 100,68 Z" fill="#E30613"/>
  </defs>

  <circle cx="100" cy="100" r="97" fill="#FFFFFF" stroke="#122E86" stroke-width="4"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#122E86" stroke-width="2"/>

  <g fill="#E30613" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="19" letter-spacing="1.5">
    <text><textPath href="#bg-top" startOffset="50%" text-anchor="middle">БОЛОВСРОЛЫН ГАЗАР</textPath></text>
    <text><textPath href="#bg-bottom" startOffset="50%" text-anchor="middle">ДОРНОГОВЬ</textPath></text>
  </g>

  <circle cx="14" cy="100" r="0"/>
  <circle cx="24" cy="100" r="5.5" fill="#122E86"/>
  <circle cx="176" cy="100" r="5.5" fill="#122E86"/>

  <g>
    <use href="#bg-petal"/>
    <use href="#bg-petal" transform="rotate(36 100 100)"/>
    <use href="#bg-petal" transform="rotate(72 100 100)"/>
    <use href="#bg-petal" transform="rotate(108 100 100)"/>
    <use href="#bg-petal" transform="rotate(144 100 100)"/>
    <use href="#bg-petal" transform="rotate(180 100 100)"/>
    <use href="#bg-petal" transform="rotate(216 100 100)"/>
    <use href="#bg-petal" transform="rotate(252 100 100)"/>
    <use href="#bg-petal" transform="rotate(288 100 100)"/>
    <use href="#bg-petal" transform="rotate(324 100 100)"/>
  </g>

  <g transform="translate(0 22)">
    <use href="#bg-trefoil"/>
    <use href="#bg-trefoil" transform="rotate(90 100 122)"/>
    <use href="#bg-trefoil" transform="rotate(180 100 122)"/>
    <use href="#bg-trefoil" transform="rotate(270 100 122)"/>
  </g>

  <circle cx="100" cy="100" r="35" fill="#FFE800" stroke="#E30613" stroke-width="3.5"/>
  <circle cx="100" cy="100" r="29" fill="none" stroke="#E30613" stroke-width="1.6"/>

  <g>
    <use href="#bg-ray"/>
    <use href="#bg-ray" transform="rotate(30 100 100)"/>
    <use href="#bg-ray" transform="rotate(60 100 100)"/>
    <use href="#bg-ray" transform="rotate(90 100 100)"/>
    <use href="#bg-ray" transform="rotate(120 100 100)"/>
    <use href="#bg-ray" transform="rotate(150 100 100)"/>
    <use href="#bg-ray" transform="rotate(180 100 100)"/>
    <use href="#bg-ray" transform="rotate(210 100 100)"/>
    <use href="#bg-ray" transform="rotate(240 100 100)"/>
    <use href="#bg-ray" transform="rotate(270 100 100)"/>
    <use href="#bg-ray" transform="rotate(300 100 100)"/>
    <use href="#bg-ray" transform="rotate(330 100 100)"/>
  </g>

  <circle cx="100" cy="100" r="9" fill="#FFE800" stroke="#E30613" stroke-width="2.5"/>
</svg>
